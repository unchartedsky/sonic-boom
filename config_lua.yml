_format_version: "1.1"
# kong-lua 전용 선언형 설정 — config_v1.yml(Go판)의 in-memory 서비스들을 미러링.
# 차이: ttl-zero·cache-control 라우트 없음(Lua는 스키마 거부 — SKIP_SCHEMA_ASSERT),
# log·in_memory 필드 없음(Lua 스키마 미선언), 검증 고정 라우트(nomatch·ctgate·maxsize·setcookie) 추가.
services:
  - host: mock-upstream
    name: example-lua-cache-control
    port: 80
    protocol: http
    routes:
      - name: route-lua-cache-control
        paths:
          - /lua-cache-control
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization]
          cache_ttl: 15
          cacheable_body_max_size: 1000000
          strategy: in-memory

  - host: mock-upstream
    name: example
    port: 80
    protocol: http
    routes:
      # wait_for_kong·본문 참조 프로브(플러그인 없음)
      - name: route-noplugins
        paths:
          - /noplugins
        strip_path: true
      - name: route-lua-probe
        paths:
          - /lua-probe
        strip_path: true

  - host: mock-upstream
    name: example-lua-in-memory
    port: 80
    protocol: http
    routes:
      - name: route-lua-in-memory
        paths:
          - /lua-in-memory
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          cache_control: false    # 가드 기본 on 이전 동작 유지 — vary 스위트(Authorization 키 분리) 고정용
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization]
          cache_ttl: 15
          cacheable_body_max_size: 1000000
          strategy: in-memory

  - host: mock-upstream
    name: example-lua-in-memory-vary
    port: 80
    protocol: http
    routes:
      - name: route-lua-in-memory-vary
        paths:
          - /lua-in-memory-vary
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          cache_control: false    # 가드 기본 on 이전 동작 유지 — vary 스위트(Authorization 키 분리) 고정용
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization, Accept-Encoding]
          cache_ttl: 15
          cacheable_body_max_size: 1000000
          strategy: in-memory

  # 아래 넷은 U4 시나리오 고정용 검증 라우트(Go config에 대응 없음)
  - host: mock-upstream
    name: example-lua-nomatch
    port: 80
    protocol: http
    routes:
      - name: route-lua-nomatch
        paths:
          - /lua-nomatch
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          strategy: in-memory
          filters:
            - name: never
              rules:
                - regexp: "^/never"

  - host: mock-upstream
    name: example-lua-ctgate
    port: 80
    protocol: http
    routes:
      - name: route-lua-ctgate
        paths:
          - /lua-ctgate
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          strategy: in-memory
          content_type: ["text/xml"]

  - host: mock-upstream
    name: example-lua-maxsize
    port: 80
    protocol: http
    routes:
      - name: route-lua-maxsize
        paths:
          - /lua-maxsize
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          strategy: in-memory
          cache_ttl: 300
          cacheable_body_max_size: 10

  - host: mock-upstream
    name: example-lua-setcookie
    port: 80
    protocol: http
    routes:
      - name: route-lua-setcookie
        paths:
          - /lua-setcookie
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          strategy: in-memory

  - host: mock-upstream
    name: example-lua-redis
    port: 80
    protocol: http
    routes:
      - name: route-lua-redis
        paths:
          - /lua-redis
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          cache_control: false    # 가드 기본 on 이전 동작 유지 — vary 스위트(Authorization 키 분리) 고정용
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization]
          cache_ttl: 15
          cacheable_body_max_size: 1000000
          strategy: redis
          redis:
            host: redis
            port: 6379

  - host: mock-upstream
    name: example-lua-redis-vary
    port: 80
    protocol: http
    routes:
      - name: route-lua-redis-vary
        paths:
          - /lua-redis-vary
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          cache_control: false    # 가드 기본 on 이전 동작 유지 — vary 스위트(Authorization 키 분리) 고정용
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization, Accept-Encoding]
          cache_ttl: 15
          cacheable_body_max_size: 1000000
          strategy: redis
          redis:
            host: redis
            port: 6379

  - host: mock-upstream
    name: example-lua-redis-cluster
    port: 80
    protocol: http
    routes:
      - name: route-lua-redis-cluster
        paths:
          - /lua-redis-cluster
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          cache_control: false    # 가드 기본 on 이전 동작 유지 — vary 스위트(Authorization 키 분리) 고정용
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization]
          cache_ttl: 15
          cacheable_body_max_size: 1000000
          strategy: redis-cluster
          redis_cluster:
            addrs: ["redis-cluster:7000"]

  # fill-lock 토글 라우트 쌍 — config_v1.yml의 /redis-nolock·/redis-stampede 미러.
  # stampede는 /api/big(약 9초 fill)이라 대기 상한을 fill보다 길게(15s) 둔다.
  - host: mock-upstream
    name: example-lua-redis-nolock
    port: 80
    protocol: http
    routes:
      - name: route-lua-redis-nolock
        paths:
          - /lua-redis-nolock
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization]
          cache_ttl: 15
          cacheable_body_max_size: 1000000
          strategy: redis
          fill_lock:
            enabled: false
          redis:
            host: redis
            port: 6379
            db_number: 3

  - host: mock-upstream
    name: example-lua-redis-stampede
    port: 80
    protocol: http
    routes:
      - name: route-lua-redis-stampede
        paths:
          - /lua-redis-stampede
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization]
          cache_ttl: 60
          cacheable_body_max_size: 1000000
          strategy: redis
          fill_lock:
            enabled: true
            ttl_ms: 30000
            wait_ms: 15000
          redis:
            host: redis
            port: 6379
            db_number: 4

  # 클러스터 fill-lock 검증용 — fork 범용 디스패치의 SET NX를 종단간으로 검증한다
  # (실패 시 fail-open이라, 이 라우트의 버스트 단언이 유일한 가드다).
  - host: mock-upstream
    name: example-lua-cluster-stampede
    port: 80
    protocol: http
    routes:
      - name: route-lua-cluster-stampede
        paths:
          - /lua-cluster-stampede
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization]
          cache_ttl: 60
          cacheable_body_max_size: 1000000
          strategy: redis-cluster
          fill_lock:
            enabled: true
            ttl_ms: 30000
            wait_ms: 15000
          redis_cluster:
            addrs: ["redis-cluster:7000"]

  - host: mock-upstream
    name: example-lua-cluster-nolock
    port: 80
    protocol: http
    routes:
      - name: route-lua-cluster-nolock
        paths:
          - /lua-cluster-nolock
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization]
          cache_ttl: 60
          cacheable_body_max_size: 1000000
          strategy: redis-cluster
          fill_lock:
            enabled: false
          redis_cluster:
            addrs: ["redis-cluster:7000"]

  - host: mock-upstream
    name: example-lua-redis-cluster-vary
    port: 80
    protocol: http
    routes:
      - name: route-lua-redis-cluster-vary
        paths:
          - /lua-redis-cluster-vary
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          cache_control: false    # 가드 기본 on 이전 동작 유지 — vary 스위트(Authorization 키 분리) 고정용
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization, Accept-Encoding]
          cache_ttl: 15
          cacheable_body_max_size: 1000000
          strategy: redis-cluster
          redis_cluster:
            addrs: ["redis-cluster:7000"]

  # Go example(/ex) 필터 미러 — 재생 비교 S5용(필터 룰·TTL 동일)
  - host: mock-upstream
    name: example-lua-filter
    port: 80
    protocol: http
    routes:
      - name: route-lua-filter
        paths:
          - /lua-filter
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          response_code: [200, 301, 404]
          request_method: [GET, HEAD, POST, PUT]
          content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
          vary_headers: [Authorization, Accept-Encoding, Accept-Language]
          filters:
            - name: path and header
              rules:
                - regexp: ".*page=\\(.*\\).*"
                - header: Authorization
                  regexp: ".*dXNlcm5hbWU6cGFzc3dvcmQ=.*"
              cache_ttl: 30
            - name: path
              rules:
                - regexp: ".*page=\\(.*\\).*"
              cache_ttl: 30
            - name: header
              rules:
                - header: Authorization
                  regexp: ".*dXNlcm5hbWU6cGFzc3dvcmQ=.*"
              cache_ttl: 30
          cache_ttl: 15
          cacheable_body_max_size: 1000000
          strategy: redis
          redis:
            host: redis
            port: 6379

  # 코어 자기검증(골든 벡터·필터·엔트리 왕복) — Nginx 런타임에서만 돈다.
  - host: mock-upstream
    name: example-lua-selfcheck
    port: 80
    protocol: http
    routes:
      - name: route-lua-selfcheck
        paths:
          - /selfcheck
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          selfcheck: true

  # 5종 벤치 — MISS는 in-memory·fill-lock 끔(내장 캐시와 같은 무락 조건).
  - host: mock-upstream
    name: example-lua-maxsize-nolock
    port: 80
    protocol: http
    routes:
      - name: route-lua-maxsize-nolock
        paths:
          - /lua-maxsize-nolock
        strip_path: true
    plugins:
      - name: sonic-boom-lua
        config:
          strategy: in-memory
          cache_ttl: 300
          cacheable_body_max_size: 10
          fill_lock:
            enabled: false

  # 5종 벤치 — Kong OSS 내장 proxy-cache(memory). MISS는 200을 저장 대상에서 빼 매 요청 upstream.
  - host: mock-upstream
    name: example-kong-proxy-cache
    port: 80
    protocol: http
    routes:
      - name: route-kong-pc
        paths:
          - /kong-pc
        strip_path: true
    plugins:
      - name: proxy-cache
        config:
          strategy: memory
          cache_ttl: 300
          content_type: ["application/json"]

  - host: mock-upstream
    name: example-kong-proxy-cache-miss
    port: 80
    protocol: http
    routes:
      - name: route-kong-pc-miss
        paths:
          - /kong-pc-miss
        strip_path: true
    plugins:
      - name: proxy-cache
        config:
          strategy: memory
          cache_ttl: 300
          content_type: ["application/json"]
          response_code: [404]
