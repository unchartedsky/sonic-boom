# 3 게이트웨이(kong·kong-lua·apisix) 공통 — depends_on·cpus·restart 흡수.
# healthcheck는 검사 명령·포트가 서비스별로 달라 앵커 밖에 둔다.
x-gateway-common: &gateway-common
  cpus: 2.0 # 벤치 공정 조건(U8): 3게이트웨이 동일 고정
  restart: on-failure
  depends_on:
    mock-upstream:
      condition: service_started
    redis:
      condition: service_started
    cluster-init:
      condition: service_healthy

services:
  mock-upstream:
    image: nginx:1.30.6-alpine
    volumes:
      - ./test/upstream/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./test/upstream/response.json:/usr/share/nginx/html/response.json:ro
      - ./test/upstream/response.deflate:/usr/share/nginx/html/response.deflate:ro
      - ./test/upstream/response.br:/usr/share/nginx/html/response.br:ro
      - ./test/upstream/response_big.json:/usr/share/nginx/html/response_big.json:ro
      - ./test/upstream/bigbody.json:/usr/share/nginx/html/bigbody.json:ro

  redis:
    image: redis:8.10.2-alpine

  # Redis Cluster: 노드 3개(재고 redis:7-alpine, 멀티아치) + init 컨테이너.
  # grokzen/redis-cluster는 amd64 변형만 있어 arm64에서 QEMU가 필요했고,
  # GH arm64 러너에서 부트스크랩이 수렴하지 않아 이 구성으로 교체했다.
  # 노드별 고유 IP(172.30.0.11-13)가 announce 주소 — kong이 MOVED 리다이렉트를
  # compose 네트워크 안에서 따라갈 수 있다. 호스트 포트 노출은 없다.
  redis-cluster-node-1:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--port", "7000", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--cluster-announce-ip", "172.30.0.11"]
    networks:
      default:
        ipv4_address: 172.30.0.11
        aliases: [redis-cluster]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis-cluster-node-2:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--port", "7000", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--cluster-announce-ip", "172.30.0.12"]
    networks:
      default:
        ipv4_address: 172.30.0.12
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis-cluster-node-3:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--port", "7000", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--cluster-announce-ip", "172.30.0.13"]
    networks:
      default:
        ipv4_address: 172.30.0.13
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

  # 클러스터 생성(1회). 이미 생성돼 있으면(check 통과) 건너뛴다.
  cluster-init:
    image: redis:8.10.2-alpine
    depends_on:
      redis-cluster-node-1:
        condition: service_healthy
      redis-cluster-node-2:
        condition: service_healthy
      redis-cluster-node-3:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        if redis-cli --cluster check 172.30.0.11:7000 >/dev/null 2>&1; then
          echo "cluster already initialized"
        else
          # create는 확인 프롬프트를 띄우므로 yes를 넣는다(안 넣으면 매달림)
          yes yes | redis-cli --cluster create 172.30.0.11:7000 172.30.0.12:7000 172.30.0.13:7000 --cluster-replicas 0
        fi
        sleep infinity
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 172.30.0.11 -p 7000 cluster info | grep -q cluster_state:ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  kong:
    # image: ghcr.io/unchartedsky/sonic-boom:sha-01f9cc1
    # image: kong:3.9.0-ubuntu
    build: .
    <<: *gateway-common
    # 베이스 이미지 헬스체크에는 start_period가 없어 동시 콜드 부팅 시
    # 20초 만에 unhealthy 판정된다(CI parity 잡 실측) — 부팅 유예를 준다.
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      # Kong Configuration
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/config.yml
      - KONG_PLUGINS=bundled,sonic-boom
      - KONG_PLUGINSERVER_NAMES=sonic-boom
      - KONG_PLUGINSERVER_SONIC_BOOM_START_CMD=/kong/go-plugins/sonic-boom
      - KONG_PLUGINSERVER_SONIC_BOOM_QUERY_CMD=/kong/go-plugins/sonic-boom -dump
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_LOG_LEVEL=debug
      - KONG_NGINX_HTTP_GZIP=on
      - KONG_NGINX_HTTP_GZIP_VARY=on
#      - KONG_NGINX_HTTP_GZIP_TYPES="application/json application/json; utf-8"
      - KONG_NGINX_HTTP_GZIP_PROXIED="any"

      # Pass OpenTelemetry environment variables to nginx
      # See https://discuss.konghq.com/t/set-multiple-env-nginx-directives/7532/3
      - KONG_NGINX_MAIN_ENV=OTEL_SDK_DISABLED;env OTEL_SERVICE_NAME;env OTEL_EXPORTER_OTLP_ENDPOINT;env OTEL_EXPORTER_OTLP_PROTOCOL;env OTEL_TRACES_SAMPLER;env OTEL_TRACES_SAMPLER_ARG;env OTEL_PROPAGATORS;env OTEL_RESOURCE_ATTRIBUTES;env OTEL_LOG_LEVEL

      # OpenTelemetry Configuration
      - OTEL_SDK_DISABLED=true
      - OTEL_SERVICE_NAME=sonic-boom
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_TRACES_SAMPLER=parentbased_always_on
      - OTEL_TRACES_SAMPLER_ARG=1.0
      - OTEL_PROPAGATORS=b3
      - OTEL_RESOURCE_ATTRIBUTES=service.name=sonic-boom
      - OTEL_LOG_LEVEL=info
    ports:
      - '8000:8000'
    volumes:
      - ./config_v1.yml:/kong/config.yml
      # build.sh가 bin/linux-${GOARCH}/sonic-boom으로 크로스컴파일한다.
      # GOARCH는 호스트 아키텍처 기본(맥 arm64), amd64 CI에서는 환경변수로 덮어쓴다.
      - ./bin/linux-${GOARCH:-arm64}:/kong/go-plugins

  # sonic-boom의 Lua 포팅(kong-lua-plugin 계획). Go판 kong(8000)과 백엔드를 공유하고
  # profile lua로 격리 — make e2e의 up/down이 Lua 개발 상태에 영향받지 않는다.
  # ./lua는 Kong 기본 Lua 트리(/usr/local/share/lua/5.1) 밖에 마운트해 번들을 섀도잉하지
  # 않는다. ';;'는 기본 package.path 폴스루.
  kong-lua:
    build:
      context: .
      dockerfile: Dockerfile.kong-lua
    <<: *gateway-common
    profiles: ["lua"]
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong/config.yml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_LOG_LEVEL=debug
      # nginx main 컨텍스트에 CACHE_VERSION env를 노출 — 설정 값 폴백이 도달 불가한 문제(#23)
      - KONG_NGINX_MAIN_ENV=CACHE_VERSION
      - CACHE_VERSION=${CACHE_VERSION:-}
    ports:
      - '8010:8000'
    volumes:
      - ./config_lua.yml:/kong/config.yml

  # sonic-boom-lua의 APISIX 어댑터. kong-lua와 같은 코어·같은 백엔드를 쓰고 profile apisix로
  # 격리한다. 호스트 포트 8020(8000 Go kong, 8010 kong-lua와 겹치지 않게).
  # 이미지에 curl이 없어 헬스체크는 bash /dev/tcp로 status API(/status/ready)를 직접 친다.
  apisix:
    build:
      context: .
      dockerfile: Dockerfile.apisix
    <<: *gateway-common
    profiles: ["apisix"]
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    ports:
      - '8020:9080'
    volumes:
      - ./config_apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro

  # go test 러너(make test). compose 네트워크 안에서 실행해
  # 맥/리눅스/CI가 같은 방식으로 redis·cluster에 접근하게 한다.
  # profiles로 평소 up -d에는 뜨지 않는다.
  go-test:
    image: golang:1.27.2
    profiles: ["test"]
    working_dir: /app
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: ["go", "test", "./...", "-race", "-count=1"]

volumes:
  shared-volume:
  go-mod-cache:
  go-build-cache:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
