server {
  listen 80;

  # e2e 압축 단언용: 이 업스트림이 유일한 gzip 압축 지점이다.
  # gzip_proxied any — 기본값 off면 프록시(Kong) 경유 요청에서 압축이 안 된다.
  gzip on;
  gzip_types application/json;
  gzip_min_length 0;
  gzip_proxied any;

  # 모든 경로에 동일한 고정 JSON을 반환한다.
  # e2e는 본문 내용이 아니라 캐시 동작(X-Cache-Status)을 검증한다.
  # location / 의 alias는 파일 뒤에 URI 나머지를 붙여 /api/users가
  # 404 text/html을 내는 함정이 있다 — 폴스루 수정(U5) 후에는 그 404가
  # content_type 게이팅에 걸린다. 정확 매칭 location이 200 JSON을 담당한다.
  location = /api/users {
    default_type application/json;
    # POST 바디 키 분리 단언용: 정적 파일의 POST는 405를 내므로 200으로 바꾼다.
    error_page 405 =200 $uri;
    alias /usr/share/nginx/html/response.json;
  }

  location / {
    default_type application/json;
    alias /usr/share/nginx/html/response.json;
  }

  # Set-Cookie 전용 픽스처 — 양 게이트웨이 모두 Set-Cookie 응답을 저장하지 않는다.
  # Cache-Control 픽스처는 /ccprivate·/ccnostore·/ccnocache와 분리돼 게이트를 격리한다.
  location = /setcookie/api/users {
    default_type application/json;
    add_header Set-Cookie "sid=abc";
    alias /usr/share/nginx/html/response.json;
  }

  # 헤더 110개 + 맨 뒤 Set-Cookie — 어댑터가 기본 상한(100)으로 헤더를 읽으면
  # Set-Cookie가 잘려 저장돼버린다(#3 fail-open 회귀 게이트). 1000 상한이면 온전히 보인다.
  location = /manyhdr/api/users {
    default_type application/json;
    add_header X-Pad-001 v;
    add_header X-Pad-002 v;
    add_header X-Pad-003 v;
    add_header X-Pad-004 v;
    add_header X-Pad-005 v;
    add_header X-Pad-006 v;
    add_header X-Pad-007 v;
    add_header X-Pad-008 v;
    add_header X-Pad-009 v;
    add_header X-Pad-010 v;
    add_header X-Pad-011 v;
    add_header X-Pad-012 v;
    add_header X-Pad-013 v;
    add_header X-Pad-014 v;
    add_header X-Pad-015 v;
    add_header X-Pad-016 v;
    add_header X-Pad-017 v;
    add_header X-Pad-018 v;
    add_header X-Pad-019 v;
    add_header X-Pad-020 v;
    add_header X-Pad-021 v;
    add_header X-Pad-022 v;
    add_header X-Pad-023 v;
    add_header X-Pad-024 v;
    add_header X-Pad-025 v;
    add_header X-Pad-026 v;
    add_header X-Pad-027 v;
    add_header X-Pad-028 v;
    add_header X-Pad-029 v;
    add_header X-Pad-030 v;
    add_header X-Pad-031 v;
    add_header X-Pad-032 v;
    add_header X-Pad-033 v;
    add_header X-Pad-034 v;
    add_header X-Pad-035 v;
    add_header X-Pad-036 v;
    add_header X-Pad-037 v;
    add_header X-Pad-038 v;
    add_header X-Pad-039 v;
    add_header X-Pad-040 v;
    add_header X-Pad-041 v;
    add_header X-Pad-042 v;
    add_header X-Pad-043 v;
    add_header X-Pad-044 v;
    add_header X-Pad-045 v;
    add_header X-Pad-046 v;
    add_header X-Pad-047 v;
    add_header X-Pad-048 v;
    add_header X-Pad-049 v;
    add_header X-Pad-050 v;
    add_header X-Pad-051 v;
    add_header X-Pad-052 v;
    add_header X-Pad-053 v;
    add_header X-Pad-054 v;
    add_header X-Pad-055 v;
    add_header X-Pad-056 v;
    add_header X-Pad-057 v;
    add_header X-Pad-058 v;
    add_header X-Pad-059 v;
    add_header X-Pad-060 v;
    add_header X-Pad-061 v;
    add_header X-Pad-062 v;
    add_header X-Pad-063 v;
    add_header X-Pad-064 v;
    add_header X-Pad-065 v;
    add_header X-Pad-066 v;
    add_header X-Pad-067 v;
    add_header X-Pad-068 v;
    add_header X-Pad-069 v;
    add_header X-Pad-070 v;
    add_header X-Pad-071 v;
    add_header X-Pad-072 v;
    add_header X-Pad-073 v;
    add_header X-Pad-074 v;
    add_header X-Pad-075 v;
    add_header X-Pad-076 v;
    add_header X-Pad-077 v;
    add_header X-Pad-078 v;
    add_header X-Pad-079 v;
    add_header X-Pad-080 v;
    add_header X-Pad-081 v;
    add_header X-Pad-082 v;
    add_header X-Pad-083 v;
    add_header X-Pad-084 v;
    add_header X-Pad-085 v;
    add_header X-Pad-086 v;
    add_header X-Pad-087 v;
    add_header X-Pad-088 v;
    add_header X-Pad-089 v;
    add_header X-Pad-090 v;
    add_header X-Pad-091 v;
    add_header X-Pad-092 v;
    add_header X-Pad-093 v;
    add_header X-Pad-094 v;
    add_header X-Pad-095 v;
    add_header X-Pad-096 v;
    add_header X-Pad-097 v;
    add_header X-Pad-098 v;
    add_header X-Pad-099 v;
    add_header X-Pad-100 v;
    add_header X-Pad-101 v;
    add_header X-Pad-102 v;
    add_header X-Pad-103 v;
    add_header X-Pad-104 v;
    add_header X-Pad-105 v;
    add_header X-Pad-106 v;
    add_header X-Pad-107 v;
    add_header X-Pad-108 v;
    add_header X-Pad-109 v;
    add_header X-Pad-110 v;
    add_header Set-Cookie "sid=trunc";
    alias /usr/share/nginx/html/response.json;
  }

  # Cache-Control 응답 디렉티브별 저장 금지 픽스처 — 한 location에 헤더 하나만.
  location = /ccprivate/api/users {
    default_type application/json;
    add_header Cache-Control "private";
    alias /usr/share/nginx/html/response.json;
  }

  location = /ccnostore/api/users {
    default_type application/json;
    add_header Cache-Control "no-store";
    alias /usr/share/nginx/html/response.json;
  }

  location = /ccnocache/api/users {
    default_type application/json;
    add_header Cache-Control "no-cache";
    alias /usr/share/nginx/html/response.json;
  }

  # deflate/br 인코딩 단언용: 사전 압축 픽스처를 해당 Content-Encoding으로 제공.
  # 정적 location이라 협상 없이 항상 압축 바이트를 내보낸다.
  location = /enc/deflate/api/users {
    default_type application/json;
    add_header Content-Encoding deflate;
    alias /usr/share/nginx/html/response.deflate;
  }

  # 스탬피드 측정용: 900KB를 100KB/s로 흘려 fill 완료까지 약 9초의
  # 미스 창을 만든다(캐시 가능 크기 1MB 이하).
  location = /api/big {
    default_type application/json;
    limit_rate 100k;
    alias /usr/share/nginx/html/response_big.json;
  }

  # U5 벤치: 큰 본문(약 100KB) HIT 픽스처 — shm→Lua 복사 비용 관측용.
  # /api/big과 달리 속도 제한이 없다(측정은 HIT 경로만 본다).
  location = /api/bigbody {
    default_type application/json;
    alias /usr/share/nginx/html/bigbody.json;
  }

  location = /enc/br/api/users {
    default_type application/json;
    add_header Content-Encoding br;
    alias /usr/share/nginx/html/response.br;
  }
}
