server {
  listen 80;

  # e2e 압축 단언용: 이 업스트림이 유일한 gzip 압축 지점이다.
  # gzip_proxied any — 기본값 off면 프록시(Kong) 경유 요청에서 압축이 안 된다.
  gzip on;
  gzip_types application/json;
  gzip_min_length 0;
  gzip_proxied any;

  # 모든 경로에 동일한 고정 JSON을 반환한다.
  # e2e는 본문 내용이 아니라 캐시 동작(X-Cache-Status)을 검증한다.
  # location / 의 alias는 파일 뒤에 URI 나머지를 붙여 /api/users가
  # 404 text/html을 내는 함정이 있다 — 폴스루 수정(U5) 후에는 그 404가
  # content_type 게이팅에 걸린다. 정확 매칭 location이 200 JSON을 담당한다.
  location = /api/users {
    default_type application/json;
    # POST 바디 키 분리 단언용: 정적 파일의 POST는 405를 내므로 200으로 바꾼다.
    error_page 405 =200 $uri;
    alias /usr/share/nginx/html/response.json;
  }

  location / {
    default_type application/json;
    alias /usr/share/nginx/html/response.json;
  }

  # Set-Cookie 전용 픽스처 — 양 게이트웨이 모두 Set-Cookie 응답을 저장하지 않는다.
  # Cache-Control 픽스처는 /ccprivate·/ccnostore·/ccnocache와 분리돼 게이트를 격리한다.
  location = /setcookie/api/users {
    default_type application/json;
    add_header Set-Cookie "sid=abc";
    alias /usr/share/nginx/html/response.json;
  }

  # deflate/br 인코딩 단언용: 사전 압축 픽스처를 해당 Content-Encoding으로 제공.
  # 정적 location이라 협상 없이 항상 압축 바이트를 내보낸다.
  location = /enc/deflate/api/users {
    default_type application/json;
    add_header Content-Encoding deflate;
    alias /usr/share/nginx/html/response.deflate;
  }

  # 스탬피드 측정용: 900KB를 100KB/s로 흘려 fill 완료까지 약 9초의
  # 미스 창을 만든다(캐시 가능 크기 1MB 이하).
  location = /api/big {
    default_type application/json;
    limit_rate 100k;
    alias /usr/share/nginx/html/response_big.json;
  }

  location = /enc/br/api/users {
    default_type application/json;
    add_header Content-Encoding br;
    alias /usr/share/nginx/html/response.br;
  }
}
