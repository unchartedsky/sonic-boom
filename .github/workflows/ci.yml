name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 통합 테스트는 compose 백엔드를 띄우고 go test를 compose 네트워크
      # 안의 golang 컨테이너에서 실행한다(로컬의 make test와 동일 경로).
      # 서버가 없으면 실패한다(fail-fast).
      - name: Run unit + integration tests
        run: make test

  smoke-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # e2e: Kong + 목업 업스트림 + 세 캐시 전략(in-memory, redis,
      # redis-cluster) 스모크. amd64 러너이므로 GOARCH를 명시한다.
      - name: Run e2e smoke tests
        run: make e2e GOARCH=amd64
