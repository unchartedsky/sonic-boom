name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 통합 테스트는 compose 백엔드를 띄우고 go test를 compose 네트워크
      # 안의 golang 컨테이너에서 실행한다(로컬의 make test와 동일 경로).
      # 서버가 없으면 실패한다(fail-fast).
      - name: Run unit + integration tests
        run: make test

  smoke-test:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
            goarch: amd64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      # e2e: Kong + 목업 업스트림 + 세 캐시 전략(in-memory, redis,
      # redis-cluster) 스모크. 클러스터 이미지(redis:7-alpine 기반 자체 빌드)는
      # 멀티아치라 두 아치 모두 네이티브로 돈다.
      - name: Run e2e smoke tests (${{ matrix.platform }})
        run: make e2e GOARCH=${{ matrix.goarch }}

  # Lua(sonic-boom-lua) e2e — 잡 분리로 Go e2e와 러너 병렬(같은 러너는
  # 포트 8000/8010·서브넷 172.30.0.0/24 충돌로 불가). Go 바이너리 불필요.
  smoke-test-lua:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Lua e2e smoke tests (${{ matrix.platform }})
        run: make e2e-lua

      - name: Dump compose diagnostics
        if: failure()
        run: |
          docker compose --profile lua ps -a || true
          docker compose logs kong-lua --tail 100 || true

  # APISIX 어댑터 e2e — 게이트웨이 × 아치 잡 경계 규약(docs/testing.md "CI 잡 경계").
  # kong-lua와 같은 스모크 3종을 GW=apisix로 돈다. 포트 8020·profile apisix로 러너 분리.
  smoke-test-apisix:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run APISIX e2e smoke tests (${{ matrix.platform }})
        run: make e2e-apisix

      - name: Dump compose diagnostics
        if: failure()
        run: |
          docker compose --profile apisix ps -a || true
          docker compose logs apisix --tail 100 || true

  # Go↔Lua 재생 비교(가장 강한 동등성 게이트) — 양 게이트웨이가 필요해
  # Go 바이너리 빌드 후 둘 다 기동. 논리 검증이라 단일 아치로 충분.
  parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Build Go plugin binary
        run: make build GOARCH=amd64

      # GOARCH는 make 커맨드라인 변수로는 별도 스텝의 compose에 전달되지 않는다.
      # 미설정이면 compose가 ./bin/linux-arm64(존재하지 않음→빈 dir 자동 생성)를
      # /kong/go-plugins에 마운트해 이미지의 바이너리를 가려 pluginserver가 죽는다.
      - name: Run parity replay (Go vs Lua)
        env:
          GOARCH: amd64
        run: |
          docker compose --profile lua up -d --build --wait
          ./scripts/parity_replay.sh
          docker compose --profile lua down -v --remove-orphans

      # compose --wait 실패 시 원인이 로그에 안 남는다(패리티 잡 1차 실패 실측) — 실패 진단 덤프
      - name: Dump compose diagnostics
        if: failure()
        run: |
          docker compose --profile lua ps -a || true
          docker compose logs kong kong-lua --tail 100 || true
          docker inspect sonic-boom-kong-1 sonic-boom-kong-lua-1 --format '{{.Name}} {{json .State.Health}}' || true

  # Kong-Lua↔APISIX 재생 비교 — 코어를 공유하는 값싼 쌍. Go 빌드 불필요, 단일 아치로 충분.
  parity-lua-apisix:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run parity replay (Kong-Lua vs APISIX)
        run: |
          docker compose --profile lua --profile apisix up -d --build --wait kong-lua apisix mock-upstream redis cluster-init
          PARITY_PAIR=lua-apisix ./scripts/parity_replay.sh
          docker compose --profile lua --profile apisix down -v --remove-orphans

      - name: Dump compose diagnostics
        if: failure()
        run: |
          docker compose --profile lua --profile apisix ps -a || true
          docker compose logs kong-lua apisix --tail 100 || true
          docker inspect sonic-boom-kong-lua-1 sonic-boom-apisix-1 --format '{{.Name}} {{json .State.Health}}' || true
