name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 통합 테스트는 compose 백엔드를 띄우고 go test를 compose 네트워크
      # 안의 golang 컨테이너에서 실행한다(로컬의 make test와 동일 경로).
      # 서버가 없으면 실패한다(fail-fast).
      - name: Run unit + integration tests
        run: make test

  smoke-test:
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
            goarch: amd64
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # arm64 러너에서 amd64 전용 grokzen/redis-cluster 이미지를
      # 돌리기 위한 QEMU binfmt (amd64에선 불필요)
      - name: Set up QEMU
        if: matrix.platform == 'linux-arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # e2e: Kong + 목업 업스트림 + 세 캐시 전략(in-memory, redis,
      # redis-cluster) 스모크.
      - name: Run e2e smoke tests (${{ matrix.platform }})
        run: make e2e GOARCH=${{ matrix.goarch }}
