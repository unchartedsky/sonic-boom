        strip_path: true

    plugins:
    - name: sonic-boom
      config:
        cache_control: false    # 가드 기본 on 이전 동작 유지 — vary 스위트(Authorization 키 분리) 고정용
        response_code:
          - 200
          - 301
          - 404
        request_method:
          - GET
          - HEAD
          - POST
          - PUT
        content_type:
          - "text/plain"
          - "text/html; charset=utf-8"
          - "application/json"
          - "application/json; charset=utf-8"
        vary_headers:
          - Authorization
        cache_ttl: 15
        cacheable_body_max_size: 1000000
        strategy: redis-cluster
        redis_cluster:
          addrs:
            - "redis-cluster:7000"
          pool_size: 10
          max_retries: 5
          dial_timeout: 5
          read_timeout: 3
          write_timeout: 3
          pool_timeout: 5
          idle_timeout: 1
        log:
          log_level: info
          diode_enabled: false
          console_logging_enabled: true
          file_log:
            enabled: true
            folder: /tmp
            filename: sonic-boom-redis-cluster.log

  - host: mock-upstream
    name: example-in-memory
    port: 80
    protocol: http
    routes:
      - name: route-in-memory
        paths:
          - /in-memory
        strip_path: true

    plugins:
    - name: sonic-boom
      config:
        cache_control: false    # 가드 기본 on 이전 동작 유지 — vary 스위트(Authorization 키 분리) 고정용
        response_code:
          - 200
          - 301
          - 404
        request_method:
          - GET
          - HEAD
          - POST
          - PUT
        content_type:
          - "text/plain"
          - "text/html; charset=utf-8"
          - "application/json"
          - "application/json; charset=utf-8"
        vary_headers:
          - Authorization
        cache_ttl: 15
        cacheable_body_max_size: 1000000
        strategy: in-memory
        in_memory:
          max_cost: 1000000
          num_counters: 1000
          buffer_items: 64
        log:
          log_level: info
          diode_enabled: false
          console_logging_enabled: true
          file_log:
            enabled: true
            folder: /tmp
            filename: sonic-boom-in-memory.log

  - host: mock-upstream
    name: example
    port: 80
    protocol: http
    routes:
      - name: route
        paths:
          - /ex
        strip_path: true

    plugins:
    - name: sonic-boom
      config:
        response_code:
          - 200
          - 301
          - 404
        request_method:
          - GET
          - HEAD
          - POST
          - PUT
        content_type:
          - "text/plain"
          - "text/html; charset=utf-8"
          - "application/json"
          - "application/json; charset=utf-8"
        vary_headers:
          - Authorization
          - Accept-Encoding
          - Accept-Language
        filters:
          - name: path and header
            rules:
            - regexp: ".*page=\\(.*\\).*"
            - header: "Authorization"
              regexp: ".*dXNlcm5hbWU6cGFzc3dvcmQ=.*"
              # `username:password` == dXNlcm5hbWU6cGFzc3dvcmQ=
            cache_ttl: 30
          - name: path
            rules:
              - regexp: ".*page=\\(.*\\).*"
            cache_ttl: 30
          - name: header
            rules:
              - header: "Authorization"
                regexp: ".*dXNlcm5hbWU6cGFzc3dvcmQ=.*"
            cache_ttl: 30
        cache_ttl: 15
        cacheable_body_max_size: 1000000
        strategy: redis
        redis:
          host: redis
          port: 6379
          db_number: 1
          pool_size: 10
          max_retries: 5
          dial_timeout: 0
          read_timeout: 0
          write_timeout: 0
          pool_timeout: 0
          idle_timeout: 0
        redis_cluster:
          addrs:
            - "redis-cluster-1:6379"
            - "redis-cluster-2:6379"
            - "redis-cluster-3:6379"
          pool_size: 10
          max_retries: 5
          dial_timeout: 0
          read_timeout: 0
          write_timeout: 0
          pool_timeout: 0
          idle_timeout: 0
        log:
          log_level: debug
          console_logging_enabled: true
          file_log:
            enabled: true
            folder: /var/log/kong
            filename: sonic-boom.log

  - host: mock-upstream
    name: proxycache
    port: 80
    protocol: http
    #  - host: mock-api.backend
    #    name: dev
    #    port: 9000
    #    protocol: http
    routes:
      - name: route3
        paths:
          - /proxycache
        strip_path: true

    plugins:
    - name: proxy-cache
      config:
        response_code:
          - 200
          - 301
          - 404
        request_method:
          - GET
          - HEAD
          - POST
          - PUT
        content_type:
          - "text/plain"
          - "text/html; charset=utf-8"
          - "application/json"
          - "application/json; charset=utf-8"
        vary_headers:
          - Authorization
        cache_ttl: 15
        strategy: memory


  - host: mock-upstream
    name: no_plugins
    port: 80
    protocol: http
    routes:
      - name: route4
        paths:
          - /noplugins
        strip_path: true

  # cache_control 라우트 — 요청층 가드는 이제 기본 on이다. 이 라우트는 가드 켠
  # 상태의 e2e 고정용(명시 true는 옵트아웃 안내용 문서화 차원). 요청 Cache-Control의
  # no-store/no-cache와 Authorization 헤더는 캐시에서 제외되고, 나머지는 정상 캐시된다.
  - host: mock-upstream
    name: example-cache-control
    port: 80
    protocol: http
    routes:
      - name: route-cache-control
        paths:
          - /cache-control
        strip_path: true

    plugins:
    - name: sonic-boom
      config:
        response_code:
          - 200
        request_method:
          - GET
          - HEAD
        content_type:
          - "application/json"
        cache_ttl: 15
        cache_control: true
        strategy: redis
        redis:
          host: redis
          port: 6379
          db_number: 1
        log:
          log_level: info
          console_logging_enabled: true
          file_log:
            enabled: true
            folder: /tmp
            filename: sonic-boom-cache-control.log

  # AE5: cache_ttl 0 명시 배포는 검증에서 거절된다(gt=0) — Bypass로 통과.
  - host: mock-upstream
    name: example-ttl-zero
    port: 80
