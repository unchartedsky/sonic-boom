_format_version: "1.1"
services:
  - host: mock-upstream
    name: example-redis
    port: 80
    protocol: http
    routes:
      - name: route-redis
        paths:
          - /redis
        strip_path: true

    plugins:
    - name: sonic-boom
      config:
        response_code:
          - 200
          - 301
          - 404
        request_method:
          - GET
          - HEAD
          - POST
          - PUT
        content_type:
          - "text/plain"
          - "text/html; charset=utf-8"
          - "application/json"
          - "application/json; charset=utf-8"
        vary_headers:
          - Authorization
        cache_ttl: 15
        cacheable_body_max_size: 1000000
        strategy: redis
        redis:
          host: redis
          port: 6379
          db_number: 1
          pool_size: 10
          max_retries: 5
          dial_timeout: 0
          read_timeout: 0
          write_timeout: 0
          pool_timeout: 0
          idle_timeout: 0
        log:
          log_level: info
          diode_enabled: false
          console_logging_enabled: true
          file_log:
            enabled: true
            folder: /tmp
            filename: sonic-boom-redis.log

  - host: mock-upstream
    name: example-redis-cluster
    port: 80
    protocol: http
    routes:
      - name: route-redis-cluster
        paths:
          - /redis-cluster
        strip_path: true

    plugins:
    - name: sonic-boom
      config:
        response_code:
          - 200
          - 301
          - 404
        request_method:
          - GET
          - HEAD
          - POST
          - PUT
        content_type:
          - "text/plain"
          - "text/html; charset=utf-8"
          - "application/json"
          - "application/json; charset=utf-8"
        vary_headers:
          - Authorization
        cache_ttl: 15
        cacheable_body_max_size: 1000000
        strategy: redis-cluster
        redis_cluster:
          addrs:
            - "redis-cluster:7000"
          pool_size: 10
          max_retries: 5
          dial_timeout: 5
          read_timeout: 3
          write_timeout: 3
          pool_timeout: 5
          idle_timeout: 1
        log:
          log_level: info
          diode_enabled: false
          console_logging_enabled: true
          file_log:
            enabled: true
            folder: /tmp
            filename: sonic-boom-redis-cluster.log

  - host: mock-upstream
    name: example-in-memory
    port: 80
    protocol: http
    routes:
      - name: route-in-memory
        paths:
          - /in-memory
        strip_path: true

    plugins:
    - name: sonic-boom
      config:
        response_code:
          - 200
          - 301
          - 404
        request_method:
          - GET
          - HEAD
          - POST
          - PUT
        content_type:
          - "text/plain"
          - "text/html; charset=utf-8"
          - "application/json"
          - "application/json; charset=utf-8"
        vary_headers:
          - Authorization
        cache_ttl: 15
        cacheable_body_max_size: 1000000
        strategy: in-memory
        in_memory:
          max_cost: 1000000
          num_counters: 1000
          buffer_items: 64
        log:
          log_level: info
          diode_enabled: false
          console_logging_enabled: true
          file_log:
            enabled: true
            folder: /tmp
            filename: sonic-boom-in-memory.log

  - host: mock-upstream
    name: example
    port: 80
    protocol: http
    routes:
      - name: route
        paths:
          - /ex
        strip_path: true

    plugins:
    - name: sonic-boom
      config:
        response_code:
          - 200
          - 301
          - 404
        request_method:
          - GET
          - HEAD
          - POST
          - PUT
        content_type:
          - "text/plain"
          - "text/html; charset=utf-8"
          - "application/json"
          - "application/json; charset=utf-8"
        vary_headers:
          - Authorization
          - Accept-Encoding
          - Accept-Language
        filters:
          - name: path and header
            rules:
            - regexp: ".*page=\\(.*\\).*"
            - header: "Authorization"
              regexp: ".*dXNlcm5hbWU6cGFzc3dvcmQ=.*"
              # `username:password` == dXNlcm5hbWU6cGFzc3dvcmQ=
            cache_ttl: 30
          - name: path
            rules:
              - regexp: ".*page=\\(.*\\).*"
            cache_ttl: 30
          - name: header
            rules:
              - header: "Authorization"
                regexp: ".*dXNlcm5hbWU6cGFzc3dvcmQ=.*"
            cache_ttl: 30
        cache_ttl: 15
        cacheable_body_max_size: 1000000
        strategy: redis
        redis:
          host: redis
          port: 6379
          db_number: 1
          pool_size: 10
          max_retries: 5
          dial_timeout: 0
          read_timeout: 0
          write_timeout: 0
          pool_timeout: 0
          idle_timeout: 0
        redis_cluster:
          addrs:
            - "redis-cluster-1:6379"
            - "redis-cluster-2:6379"
            - "redis-cluster-3:6379"
          pool_size: 10
          max_retries: 5
          dial_timeout: 0
          read_timeout: 0
          write_timeout: 0
          pool_timeout: 0
          idle_timeout: 0
        log:
          log_level: debug
          console_logging_enabled: true
          file_log:
            enabled: true
            folder: /var/log/kong
            filename: sonic-boom.log

  - host: mock-upstream
    name: proxycache
    port: 80
    protocol: http
    #  - host: mock-api.backend
    #    name: dev
    #    port: 9000
    #    protocol: http
    routes:
      - name: route3
        paths:
          - /proxycache
        strip_path: true

    plugins:
    - name: proxy-cache
      config:
        response_code:
          - 200
          - 301
          - 404
        request_method:
          - GET
          - HEAD
          - POST
          - PUT
        content_type:
          - "text/plain"
          - "text/html; charset=utf-8"
          - "application/json"
          - "application/json; charset=utf-8"
        vary_headers:
          - Authorization
        cache_ttl: 15
        strategy: memory


  - host: mock-upstream
    name: no_plugins
    port: 80
    protocol: http
    routes:
      - name: route4
        paths:
          - /noplugins
        strip_path: true

  # AE5: cache_ttl 0 명시 배포는 검증에서 거절된다(gt=0) — Bypass로 통과.
  - host: mock-upstream
    name: example-ttl-zero
    port: 80
    protocol: http
    routes:
      - name: route-ttl-zero
        paths:
          - /ttl-zero
        strip_path: true

    plugins:
    - name: sonic-boom
      config:
        response_code:
          - 200
        request_method:
          - GET
          - HEAD
        content_type:
          - "application/json"
        cache_ttl: 0
        strategy: redis
        redis:
          host: redis
          port: 6379
          db_number: 1
        log:
          log_level: info
          console_logging_enabled: true
          file_log:
            enabled: true
            folder: /tmp
            filename: sonic-boom-ttl-zero.log

  # gzip×vary 키 분리 단언 전용 복제 라우트. 기존 전략 라우트는
  # vary를 건드리지 않고(교차 오염 단언용), 여기에만 Accept-Encoding이
  # vary에 들어간다. 본문·업스트림은 전략 라우트와 동일하다.
