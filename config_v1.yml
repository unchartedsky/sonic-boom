          - "text/html; charset=utf-8"
          - "application/json"
          - "application/json; charset=utf-8"
        vary_headers:
          - Authorization
          - Accept-Encoding
        cache_ttl: 15
        cacheable_body_max_size: 1000000
        strategy: redis
        redis:
          host: redis
          port: 6379
          db_number: 1
          pool_size: 10
          max_retries: 5
          dial_timeout: 0
          read_timeout: 0
          write_timeout: 0
          pool_timeout: 0
          idle_timeout: 0
        log:
          log_level: info
          diode_enabled: false
          console_logging_enabled: true
          file_log:
            enabled: true
            folder: /tmp
            filename: sonic-boom-redis-vary.log

