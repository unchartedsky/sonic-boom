# APISIX standalone 선언형 설정 — config_lua.yml(Kong-Lua)의 라우트를 같은 경로로 미러링한다.
# smoke_lib.sh·parity_replay.sh가 /lua-* 경로를 그대로 쓰기 때문이다(GW_BASE만 다르다).
# Kong strip_path는 proxy-rewrite regex_uri로 흉내 낸다. 파일은 반드시 #END로 끝난다 —
# 없으면 APISIX가 라우트를 조용히 로드하지 않는다.
upstreams:
  - id: mock
    type: roundrobin
    # Kong preserve_host=false와 같게 업스트림 호스트로 Host를 보낸다.
    pass_host: node
    nodes:
      "mock-upstream:80": 1

routes:
  # wait_for_kong·본문 참조 프로브(플러그인 없음)
  - id: noplugins
    uri: /noplugins/*
    upstream_id: mock
    plugins:
      proxy-rewrite:
        regex_uri: ["^/noplugins(/.*)", "$1"]

  - id: lua-probe
    uri: /lua-probe/*
    upstream_id: mock
    plugins:
      proxy-rewrite:
        regex_uri: ["^/lua-probe(/.*)", "$1"]

  - id: lua-in-memory
    uri: /lua-in-memory/*
    upstream_id: mock
    plugins:
      proxy-rewrite:
        regex_uri: ["^/lua-in-memory(/.*)", "$1"]
      sonic-boom-lua:
        response_code: [200, 301, 404]
        request_method: [GET, HEAD, POST, PUT]
        content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
        vary_headers: [Authorization]
        cache_ttl: 15
        cacheable_body_max_size: 1000000
        strategy: in-memory

  - id: lua-in-memory-vary
    uri: /lua-in-memory-vary/*
    upstream_id: mock
    plugins:
      proxy-rewrite:
        regex_uri: ["^/lua-in-memory-vary(/.*)", "$1"]
      sonic-boom-lua:
        response_code: [200, 301, 404]
        request_method: [GET, HEAD, POST, PUT]
        content_type: ["text/plain", "text/html; charset=utf-8", "application/json", "application/json; charset=utf-8"]
        vary_headers: [Authorization, Accept-Encoding]
        cache_ttl: 15
        cacheable_body_max_size: 1000000
        strategy: in-memory

  # 아래 넷은 고정 시나리오 검증 라우트(config_lua.yml과 같다)
  - id: lua-nomatch
    uri: /lua-nomatch/*
    upstream_id: mock
    plugins:
      proxy-rewrite:
        regex_uri: ["^/lua-nomatch(/.*)", "$1"]
      sonic-boom-lua:
        strategy: in-memory
        filters:
          - name: never
            rules:
              - regexp: "^/never"

  - id: lua-ctgate
    uri: /lua-ctgate/*
    upstream_id: mock
    plugins:
      proxy-rewrite:
        regex_uri: ["^/lua-ctgate(/.*)", "$1"]
      sonic-boom-lua:
        strategy: in-memory
        content_type: ["text/xml"]

  - id: lua-maxsize
    uri: /lua-maxsize/*
    upstream_id: mock
    plugins:
      proxy-rewrite:
        regex_uri: ["^/lua-maxsize(/.*)", "$1"]
      sonic-boom-lua:
        strategy: in-memory
        cache_ttl: 300
        cacheable_body_max_size: 10

  - id: lua-setcookie
    uri: /lua-setcookie/*
    upstream_id: mock
    plugins:
      proxy-rewrite:
        regex_uri: ["^/lua-setcookie(/.*)", "$1"]
      sonic-boom-lua:
        strategy: in-memory

  # 스키마 거부 검증: 미구현 필드 cache_control은 additionalProperties=false로 거부된다.
  # APISIX standalone은 항목 단위로 건너뛰므로 이 라우트만 404가 되고 나머지는 산다.
  - id: lua-schema-reject
    uri: /lua-schema-reject/*
    upstream_id: mock
    plugins:
      sonic-boom-lua:
        strategy: in-memory
        cache_control: true

  # 코어 자기검증(골든 벡터·필터·엔트리 왕복·fill-lock 계약) — Nginx 런타임에서만 돈다.
  - id: selfcheck
    uri: /selfcheck/*
    upstream_id: mock
    plugins:
      sonic-boom-lua:
        selfcheck: true
#END
